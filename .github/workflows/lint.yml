name: Lint directory

on:
  pull_request:
    paths:
      - "README.md"
      - "servers/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "servers/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Check entry format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint server files and README
        run: python3 scripts/lint.py
