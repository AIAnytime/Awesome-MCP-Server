name: Lint directory

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/scripts/lint_readme.py"
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/scripts/lint_readme.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Check entry format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint README entries
        run: python3 .github/scripts/lint_readme.py
