name: inject-claimidx
on:
  workflow_dispatch:
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert ClaimIDX into README
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text()
          if 'claimidx' in t.lower():
              print('already present')
              raise SystemExit(0)
          entry = ('- **[ClaimIDX](https://github.com/claimidx/claimidx)** `stdio` — '
                   'Prior-art failure index for agents: ask before you retry; mint/claim after you learn. '
                   'Install: `pip install "claimidx[server]>=0.7.12"` → `claimidx init --agent NAME` → '
                   '`claimidx claim --yes --channel dir-aianytime --source path-b`. '
                   'Optional hold: `cix_bdc82291f2fbb06a`. '
                   'MCP: claimidx-mcp · Site: https://claimidx.com · Registry: io.github.claimidx/claimidx\n')
          lines = t.splitlines(keepends=True)
          out = []
          done = False
          for line in lines:
              if (not done) and 'ContextStream' in line and line.lstrip().startswith('-'):
                  out.append(entry)
                  done = True
              out.append(line)
          if not done:
              raise SystemExit('anchor not found')
          p.write_text(''.join(out))
          print('inserted')
          PY
      - name: Commit
        run: |
          git config user.name AhmiDarrow
          git config user.email ahmitdarrow@gmail.com
          git add README.md
          git diff --cached --quiet || git commit -m 'Add ClaimIDX to Knowledge, memory & context'
          git push
